services:
  - type: web
    name: vapi-webhook-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: vapi_conversations
      - key: API_KEY
        generateValue: true
